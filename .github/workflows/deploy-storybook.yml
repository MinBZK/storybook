name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Hygiëne: deze workflow declareerde `contents: read` al vóór deze PR,
          # dus hier stond geen read-write token op het spel zoals in ci.yml en
          # validate.yml. Het token draagt wel `pages: write`, en het blijft de
          # hele job bereikbaar via de git-config van deze checkout terwijl
          # `build-storybook` dependency-code draait. Geen enkele stap heeft het
          # nodig: configure-pages en upload-pages-artifact gaan niet via git.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts: a hijacked dependency release must not get to run its
      # preinstall/postinstall hook in the job that publishes to Pages.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build styles
        run: npm run build:styles

      - name: Build Storybook
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './storybook-static'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
