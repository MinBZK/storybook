name: Publish to npmjs

# Requires repository secret NPM_TOKEN: a granular npmjs token with
# read+write access to the @nldd scope and 2FA bypass enabled.
# Without it, the publish step fails with E401/EAUTH at runtime.

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish when triggered by version-bump commit, release, or manual dispatch
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@nldd'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Update version (if specified)
        if: ${{ inputs.version != '' }}
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to npmjs
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
