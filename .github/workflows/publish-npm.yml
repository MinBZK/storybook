name: Publish to npmjs

# Publishing runs on npmjs trusted publishing: the package trusts this
# repository and this workflow file by name, and npm exchanges the GitHub OIDC
# token for publish rights. There is no npm token in this repository, and the
# trust is registered under Settings > Trusted Publisher on the package, where
# the workflow filename below has to match. Rename this file and publishing
# stops until that field is updated.
#
# The work is still split over two jobs. `npm run build` executes third-party
# code by design - vite, tsc, the custom-elements analyzer and every plugin
# they load. `build` hands over a finished tarball and can request no
# credentials of its own: id-token: write is granted to `publish` alone, so an
# OIDC token can only be minted where nothing but npm runs. --ignore-scripts
# closes the install moment; this closes the credential exposure of the build
# moment. It does not make the build output trustworthy - a hijacked build
# dependency can still poison dist/, and that dist/ goes into the tarball the
# provenance vouches for.

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    # Only publish when triggered by version-bump commit, release, or manual dispatch
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # --ignore-scripts: a hijacked dependency release must not get to run its
      # preinstall/postinstall hook. Nothing in this tree needs lifecycle
      # scripts at install time; the build runs its generators explicitly.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build

      # De input gaat via de env in plaats van via ${{ }} in de run-regel:
      # workflow_dispatch-input is vrije tekst en zou daar als shellcode worden
      # geïnterpreteerd. De `--` scheidt hem daarnaast van de vlaggen: zonder
      # die scheiding leest npm een waarde die met `-` begint als optie.
      - name: Update version (if specified)
        if: ${{ inputs.version != '' }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: npm version --no-git-tag-version -- "$INPUT_VERSION"

      # npm bepaalt zelf wat er in het pakket hoort: `files` in package.json,
      # plus de bestanden die npm sowieso insluit. Een handgeschreven padlijst
      # hier zou daar stilzwijgend naast gaan lopen zodra `files` verandert, en
      # dat levert een incompleet pakket op mét geldige provenance.
      - name: Pack publish payload
        run: npm pack --ignore-scripts

      - name: Upload publish payload
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          # Ruim genoeg om een mislukte publish-job later opnieuw te draaien
          # zonder de build over te moeten doen.
          retention-days: 7
          if-no-files-found: error
          path: '*.tgz'

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Draagt twee dingen: npm ruilt dit token bij Sigstore in voor een
      # signing-certificaat (`--provenance`), en npmjs ruilt het in voor
      # publicatierechten (trusted publishing). Staat bewust alleen op deze job.
      id-token: write
    steps:
      # The one place the version is written by hand, and it cannot be otherwise
      # here: this job deliberately does not check out the repository (it only
      # publishes the tarball `build` packed), so there is no .nvmrc to read.
      # Keep it equal to .nvmrc. Adding a checkout to read a single file would
      # pull more into this job than it needs, which is what the setup avoids.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@nldd'

      - name: Download publish payload
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      # Publiceren vanuit de tarball: npm leest het manifest uit het archief en
      # draait geen enkel lifecycle-script, want die draaien alleen bij een
      # directory-publish. --ignore-scripts blijft staan als tweede slot, al
      # houdt die vlag in npm 10 wél de pack- en publish-scripts tegen, maar
      # `prepare` niet. Een tarball-publish zet geen `gitHead` in de metadata;
      # de provenance legt de commit-sha al vast.
      # Geen NODE_AUTH_TOKEN: npm haalt z'n rechten uit het OIDC-token van de
      # job. Zet je hier alsnog een token neer, dan probeert npm die eerst, en
      # dan zegt een verlopen token 404 terwijl de trusted publisher klaarstaat.
      - name: Publish to npmjs
        run: npm publish ./*.tgz --provenance --ignore-scripts
