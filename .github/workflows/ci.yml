name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build-and-check:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      # --ignore-scripts: a hijacked dependency release must not get to run its
      # preinstall/postinstall hook in CI. Nothing in this tree needs lifecycle
      # scripts at install time; the browsers come from the explicit
      # `playwright install` in the next step, which has always been required.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run ESLint (including lit-a11y rules)
        run: npm run lint
      # The build excludes test files (tsconfig.build.json), so type errors in
      # tests only surface here. Kept at zero since 252b828 — keep it there.
      - name: Type-check, including test files
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test:run
      - name: Build styles
        run: npm run build:styles
      - name: Build components
        run: npm run build:components
      - name: Verify exports map is up to date
        run: node scripts/generate-exports.js && git diff --exit-code package.json
      - name: Verify plugin manifests follow the package version
        run: npm run generate:plugin-version && git diff --exit-code .claude-plugin/
